<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLC Flix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="code.css">
    <link rel="icon" href="img/FLC Flix logo.png">
    <link rel="favicon" href="img/FLC Flix logo.png">
</head>

<body>
    <div class="background">
        <div class="orb orb-blue"></div>
        <div class="orb orb-purple"></div>
    </div>
    <main class="landing fade-in" id="landing">
        <header>
            <img src="img/FLC Flix back.png" alt="FLC Flix" class="logo">
        </header>
        <h1 class="subtitle">Fait son retour !</h1>
        <div class="timer" id="timer">
            <span><span id="days">00</span>j</span>
            <span><span id="hours">00</span>h</span>
            <span><span id="minutes">00</span>m</span>
            <span><span id="seconds">00</span>s</span>
        </div>
        <div class="code-box">
            <input type="text" id="codeInput" placeholder="Entrer le code">
            <button id="codeButton">Valider</button>
        </div>
    </main>

    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close" id="closePopup">&times;</span>
            <img src="img/FILMS.png" alt="Image secrète">
            <img src="img/SERIES.png" alt="Image secrète">
        </div>
    </div>

    <script src="timer.js"></script>
    <script src="code.js"></script>
</body>
</html>
